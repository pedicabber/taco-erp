openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TacoTracker3 (TacoT3) API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: projects
    description: Project management
  - name: departments
    description: Department management
  - name: tasks
    description: Task management
  - name: notifications
    description: Notification management
  - name: calendar
    description: Calendar/timeline views
  - name: storage
    description: File storage
  - name: office-ops
    description: Office Ops lightweight task workspace
  - name: safety
    description: Safety module — Lockout/Tagout (LOTO) workflow

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Users ───────────────────────────────────────────────────────────────────

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current authenticated user profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found

  # ─── Projects ────────────────────────────────────────────────────────────────

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/summary:
    get:
      operationId: getProjectSummary
      tags: [projects]
      summary: Get project summary with task counts per status and department
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"

  /projects/{projectId}/reschedule:
    post:
      operationId: rescheduleProject
      tags: [projects]
      summary: >-
        Reschedule a project's ACTIVE dates without touching the baseline.
        Restricted to admins or the project creator.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleProjectBody"
      responses:
        "200":
          description: Rescheduled project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Not allowed
        "404":
          description: Not found

  /projects/{projectId}/attachments:
    get:
      operationId: listProjectAttachments
      tags: [projects]
      summary: List project attachments
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of project attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectAttachment"
    post:
      operationId: addProjectAttachment
      tags: [projects]
      summary: Add a project attachment
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectAttachmentBody"
      responses:
        "201":
          description: Project attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAttachment"

  /projects/{projectId}/attachments/{attachmentId}:
    delete:
      operationId: deleteProjectAttachment
      tags: [projects]
      summary: Delete a project attachment
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/all-attachments:
    get:
      operationId: getProjectAllAttachments
      tags: [projects]
      summary: Get project and task attachments grouped for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: All project attachments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAllAttachments"

  /projects/parse-pdf:
    post:
      operationId: parsePdf
      tags: [projects]
      summary: Parse a quote PDF to extract project details
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: Parsed project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedPdfData"

  # ─── Departments ─────────────────────────────────────────────────────────────

  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List all departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentBody"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{departmentId}:
    get:
      operationId: getDepartment
      tags: [departments]
      summary: Get department by ID
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentBody"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Tasks ───────────────────────────────────────────────────────────────────

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks with optional filters
      parameters:
        - name: projectId
          in: query
          schema:
            type: ["integer", "null"]
        - name: departmentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: assigneeId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{taskId}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get task by ID
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/me/active-timer:
    get:
      operationId: getMyActiveTimer
      tags: [tasks]
      summary: Get the caller's currently-running task (or null)
      responses:
        "200":
          description: Active task or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Task"
                  - type: "null"

  /tasks/me/recent-timers:
    get:
      operationId: getMyRecentTimers
      tags: [tasks]
      summary: Distinct tasks the caller recently clocked, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Recent timer entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentTimerEntry"

  /tasks/{taskId}/timer/switch:
    post:
      operationId: switchTaskTimer
      tags: [tasks]
      summary: Stop the caller's active task (if any) and start the target task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Switch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchTimerResponse"

  /tasks/{taskId}/timer/start:
    post:
      operationId: startTaskTimer
      tags: [tasks]
      summary: Start the timer for a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task with updated timer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{taskId}/timer/stop:
    post:
      operationId: stopTaskTimer
      tags: [tasks]
      summary: Stop the timer for a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task with updated timer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{taskId}/timer/edit:
    patch:
      operationId: editTaskTimer
      tags: [tasks]
      summary: Manually edit the elapsed time for a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditTimerBody"
      responses:
        "200":
          description: Task with updated elapsed time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{taskId}/followers:
    post:
      operationId: followTask
      tags: [tasks]
      summary: Follow a task (receive notifications)
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: unfollowTask
      tags: [tasks]
      summary: Unfollow a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{taskId}/relations:
    get:
      operationId: getTaskRelations
      tags: [tasks]
      summary: Get linked/related tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Related tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: addTaskRelation
      tags: [tasks]
      summary: Link a related task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTaskRelationBody"
      responses:
        "201":
          description: Relation added
    delete:
      operationId: removeTaskRelation
      tags: [tasks]
      summary: Remove a task relation
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTaskRelationBody"
      responses:
        "204":
          description: Relation removed

  /tasks/{taskId}/attachments:
    get:
      operationId: listTaskAttachments
      tags: [tasks]
      summary: List attachments for a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskAttachment"
    post:
      operationId: addTaskAttachment
      tags: [tasks]
      summary: Add a file attachment to a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAttachmentBody"
      responses:
        "201":
          description: Created attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAttachment"

  /tasks/{taskId}/attachments/{attachmentId}:
    delete:
      operationId: deleteTaskAttachment
      tags: [tasks]
      summary: Delete a task attachment
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Kanban ──────────────────────────────────────────────────────────────────

  /kanban:
    get:
      operationId: getKanbanColumns
      tags: [tasks]
      summary: Get tasks grouped by status (Kanban view)
      parameters:
        - name: projectId
          in: query
          schema:
            type: ["integer", "null"]
        - name: departmentId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Tasks grouped by column/status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KanbanColumn"

  /kanban/columns:
    get:
      operationId: getKanbanColumnConfigs
      tags: [tasks]
      summary: Get configurable kanban columns
      responses:
        "200":
          description: Kanban column configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KanbanColumnConfig"
    post:
      operationId: createKanbanColumn
      tags: [tasks]
      summary: Create a kanban column
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKanbanColumnBody"
      responses:
        "201":
          description: Created kanban column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanColumnConfig"

  /kanban/columns/{id}:
    patch:
      operationId: updateKanbanColumn
      tags: [tasks]
      summary: Update a kanban column
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKanbanColumnBody"
      responses:
        "200":
          description: Updated kanban column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanColumnConfig"
    delete:
      operationId: deleteKanbanColumn
      tags: [tasks]
      summary: Delete a kanban column
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Calendar ────────────────────────────────────────────────────────────────

  /calendar/events:
    get:
      operationId: getCalendarEvents
      tags: [calendar]
      summary: Get calendar events (tasks with dates) for Gantt view
      parameters:
        - name: projectId
          in: query
          schema:
            type: ["integer", "null"]
        - name: departmentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: assigneeId
          in: query
          schema:
            type: ["integer", "null"]
        - name: startDate
          in: query
          schema:
            type: ["string", "null"]
        - name: endDate
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"

  # ─── Dashboard ───────────────────────────────────────────────────────────────

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [projects]
      summary: Get overall dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /activity:
    get:
      operationId: getActivityFeed
      tags: [tasks]
      summary: Get recent activity across all tasks
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Activity feed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── Notifications ───────────────────────────────────────────────────────────

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    post:
      operationId: createGeneralNotification
      tags: [notifications]
      summary: Send a general notification to one or more users (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGeneralNotificationBody"
      responses:
        "201":
          description: Created broadcast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentBroadcast"

  /notifications/sent:
    get:
      operationId: listSentNotifications
      tags: [notifications]
      summary: List general notifications I have sent (admin only)
      responses:
        "200":
          description: Sent broadcasts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SentBroadcast"

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                required:
                  - count

  # ─── Storage ─────────────────────────────────────────────────────────────────

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /storage/objects/{objectPath}:
    get:
      operationId: getObject
      tags: [storage]
      summary: Serve a stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object file

  # ─── Office Ops ──────────────────────────────────────────────────────────────

  /office-ops/tasks:
    get:
      operationId: listOfficeOpsTasks
      tags: [office-ops]
      summary: List Office Ops tasks visible to the caller
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [open, completed, overdue]
            default: open
        - name: scope
          in: query
          required: false
          description: "`mine` (default) = assigned to me OR unassigned OR created by me. `all` = every task."
          schema:
            type: string
            enum: [mine, all]
            default: mine
      responses:
        "200":
          description: List of Office Ops tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOfficeOpsTasksResponse"
        "403":
          description: Caller is not an Office Ops member
    post:
      operationId: createOfficeOpsTask
      tags: [office-ops]
      summary: Create an Office Ops task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfficeOpsTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeOpsTask"
        "403":
          description: Caller is not an Office Ops member

  /office-ops/tasks/{taskId}:
    get:
      operationId: getOfficeOpsTask
      tags: [office-ops]
      summary: Get a single Office Ops task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Office Ops task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeOpsTask"
        "404":
          description: Not found
    patch:
      operationId: updateOfficeOpsTask
      tags: [office-ops]
      summary: Update an Office Ops task. Marking status=completed on a recurring task creates the next instance.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOfficeOpsTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeOpsTask"
        "404":
          description: Not found
    delete:
      operationId: deleteOfficeOpsTask
      tags: [office-ops]
      summary: Delete an Office Ops task (admin only)
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Caller is not an admin

  # ─── Safety / LOTO ───────────────────────────────────────────────────────────

  /loto/dashboard-summary:
    get:
      operationId: getLotoDashboardSummary
      tags: [safety]
      summary: Counts for the Safety dashboard cards
      responses:
        "200":
          description: Dashboard counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoDashboardSummary"

  /loto:
    get:
      operationId: listLoto
      tags: [safety]
      summary: List LOTO records (company-wide visibility)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, active, pending_review, closed]
        - name: projectId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: q
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of LOTO records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLotoResponse"
    post:
      operationId: createLoto
      tags: [safety]
      summary: Create a draft LOTO record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLotoBody"
      responses:
        "201":
          description: Created LOTO record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoRecord"
        "403":
          description: Caller lacks Safety access

  /loto/{lotoId}:
    get:
      operationId: getLoto
      tags: [safety]
      summary: Get a single LOTO record
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: LOTO record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoRecord"
        "404":
          description: Not found
    patch:
      operationId: updateLoto
      tags: [safety]
      summary: Update a draft LOTO record (fields + checklist). Allowed only while status=draft.
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLotoBody"
      responses:
        "200":
          description: Updated LOTO record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoRecord"
        "403":
          description: Caller lacks Safety access
        "404":
          description: Not found
        "409":
          description: Record is not in draft and cannot be edited

  /loto/{lotoId}/activate:
    post:
      operationId: activateLoto
      tags: [safety]
      summary: Activate a draft LOTO. Requires all 6 checklist sections complete and a commander assigned.
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateLotoBody"
      responses:
        "200":
          description: Activated LOTO record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoRecord"
        "403":
          description: Caller lacks Safety access
        "409":
          description: Not draft, checklist incomplete, or no commander assigned

  /loto/{lotoId}/work-log:
    post:
      operationId: addLotoWorkLog
      tags: [safety]
      summary: Add a Work-Phase note or issue to an active LOTO record.
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LotoWorkLogBody"
      responses:
        "201":
          description: Created work-log event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoEvent"
        "403":
          description: Caller lacks Safety access
        "409":
          description: Record is not active

  /loto/{lotoId}/request-release:
    post:
      operationId: requestLotoRelease
      tags: [safety]
      summary: Request release of an active LOTO with the Request-Release checklist. Notifies the assigned commander.
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestLotoReleaseBody"
      responses:
        "200":
          description: LOTO record now pending commander review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoRecord"
        "403":
          description: Caller lacks Safety access
        "409":
          description: Record is not active

  /loto/{lotoId}/commander-review:
    post:
      operationId: reviewLoto
      tags: [safety]
      summary: >-
        Commander review of a pending LOTO. Approve (records review comments) or
        reject (returns the record to active). Restricted to the assigned
        commander or an admin.
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommanderReviewBody"
      responses:
        "200":
          description: Reviewed LOTO record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoRecord"
        "403":
          description: Caller is not the assigned commander or an admin
        "409":
          description: Record is not pending commander review

  /loto/{lotoId}/authorize-energization:
    post:
      operationId: authorizeLotoEnergization
      tags: [safety]
      summary: >-
        Authorize re-energization of a reviewed/approved LOTO. Records who
        authorized, when, and any comments. Restricted to the assigned commander
        or an admin.
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeEnergizationBody"
      responses:
        "200":
          description: Authorized LOTO record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoRecord"
        "403":
          description: Caller is not the assigned commander or an admin
        "409":
          description: Record is not approved for authorization

  /loto/{lotoId}/close:
    post:
      operationId: closeLoto
      tags: [safety]
      summary: >-
        Close out an authorized LOTO. Sets status to closed and makes the record
        permanently immutable. Restricted to the assigned commander or an admin.
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseLotoBody"
      responses:
        "200":
          description: Closed LOTO record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoRecord"
        "403":
          description: Caller is not the assigned commander or an admin
        "409":
          description: Record is not authorized for closeout

  /loto/{lotoId}/events:
    get:
      operationId: listLotoEvents
      tags: [safety]
      summary: List the permanent audit trail for a LOTO record
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLotoEventsResponse"

  /loto/{lotoId}/audit-notes:
    post:
      operationId: addLotoAuditNote
      tags: [safety]
      summary: Append a correction/audit note to a LOTO record (admin only). Permitted even on closed records.
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLotoAuditNoteBody"
      responses:
        "201":
          description: Created audit event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoEvent"
        "403":
          description: Caller is not an admin

  /loto/{lotoId}/attachments:
    get:
      operationId: listLotoAttachments
      tags: [safety]
      summary: List attachments for a LOTO record
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLotoAttachmentsResponse"
    post:
      operationId: addLotoAttachment
      tags: [safety]
      summary: Attach an uploaded object to a LOTO record (images/PDF/office docs only)
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLotoAttachmentBody"
      responses:
        "201":
          description: Attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotoAttachment"
        "400":
          description: Unsupported file type or size
        "403":
          description: Caller lacks Safety access

  /loto/{lotoId}/attachments/{attachmentId}:
    delete:
      operationId: deleteLotoAttachment
      tags: [safety]
      summary: Delete a LOTO attachment
      parameters:
        - name: lotoId
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Caller lacks Safety access

  /projects/{projectId}/active-loto:
    get:
      operationId: getProjectActiveLoto
      tags: [safety]
      summary: >-
        Active/pending LOTO records for a project, for the company-wide warning
        banner. Available to any authenticated user (not gated by Safety access).
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active/pending LOTO banner items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLotoBannerResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        departmentId:
          type: ["integer", "null"]
        departmentName:
          type: ["string", "null"]
        departmentIds:
          type: array
          items:
            type: integer
        officeOpsAccess:
          type: boolean
          description: True when the caller is an admin or a member of the OFFICE/ADMIN department (primary or via user_departments).
        safetyAccess:
          type: boolean
          description: True for every authenticated user (Admin or Member). The Safety/LOTO module is company-wide, so this flag gates only nav visibility and create/manage actions; commander-only actions remain restricted separately.
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - clerkId
        - name
        - email
        - role
        - departmentId
        - departmentName
        - departmentIds
        - officeOpsAccess
        - safetyAccess
        - avatarUrl
        - createdAt

    UpdateMeBody:
      type: object
      properties:
        name:
          type: string
        departmentId:
          type: ["integer", "null"]
        avatarUrl:
          type: ["string", "null"]

    DelayReason:
      type: string
      enum:
        - customer_delay
        - engineering_revision
        - vendor_delay
        - internal_capacity
        - quality_issue
        - scope_change
        - other

    DriftSeverity:
      type: string
      enum: [green, yellow, red]

    PhaseWindow:
      type: object
      properties:
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        weeks:
          type: ["number", "null"]
      required: [startDate, endDate, weeks]

    ProjectSchedule:
      type: object
      properties:
        baselineStartDate:
          type: ["string", "null"]
        baselineDeliveryDate:
          type: ["string", "null"]
        activeStartDate:
          type: ["string", "null"]
        activeDeliveryDate:
          type: ["string", "null"]
        scheduleDriftDays:
          type: integer
        driftSeverity:
          $ref: "#/components/schemas/DriftSeverity"
        delayReason:
          oneOf:
            - $ref: "#/components/schemas/DelayReason"
            - type: "null"
        delayNotes:
          type: ["string", "null"]
        engineeringPhase:
          $ref: "#/components/schemas/PhaseWindow"
        manufacturingPhase:
          $ref: "#/components/schemas/PhaseWindow"
      required:
        - baselineStartDate
        - baselineDeliveryDate
        - activeStartDate
        - activeDeliveryDate
        - scheduleDriftDays
        - driftSeverity
        - delayReason
        - delayNotes
        - engineeringPhase
        - manufacturingPhase

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        company:
          type: string
        projectId:
          type: string
        description:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        deliveryDate:
          type: ["string", "null"]
        fullDescription:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        totalPrice:
          type: ["string", "null"]
        scopeOfWork:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [active, completed, on_hold, cancelled]
        createdById:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        schedule:
          $ref: "#/components/schemas/ProjectSchedule"
      required:
        - id
        - name
        - company
        - projectId
        - description
        - startDate
        - status
        - priority
        - createdById
        - createdAt
        - updatedAt
        - schedule

    CreateProjectBody:
      type: object
      properties:
        name:
          type: string
        company:
          type: string
        projectId:
          type: string
        description:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        deliveryDate:
          type: ["string", "null"]
        fullDescription:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        totalPrice:
          type: ["string", "null"]
        scopeOfWork:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [active, completed, on_hold, cancelled]
      required:
        - name
        - company
        - projectId

    UpdateProjectBody:
      type: object
      properties:
        name:
          type: string
        company:
          type: string
        projectId:
          type: string
        description:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        deliveryDate:
          type: ["string", "null"]
        fullDescription:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        totalPrice:
          type: ["string", "null"]
        scopeOfWork:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [active, completed, on_hold, cancelled]

    RescheduleProjectBody:
      type: object
      properties:
        activeStartDate:
          type: ["string", "null"]
        activeDeliveryDate:
          type: ["string", "null"]
        delayReason:
          $ref: "#/components/schemas/DelayReason"
        delayNotes:
          type: ["string", "null"]
      required:
        - delayReason

    ParsedPdfData:
      type: object
      properties:
        company:
          type: string
        name:
          type: string
        projectId:
          type: string
        description:
          type: string
        startDate:
          type: string
      required:
        - company
        - name
        - projectId
        - description
        - startDate

    ProjectSummary:
      type: object
      properties:
        projectId:
          type: ["integer", "null"]
        totalTasks:
          type: integer
        tasksByStatus:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
            required:
              - status
              - count
        tasksByDepartment:
          type: array
          items:
            type: object
            properties:
              departmentId:
                type: integer
              departmentName:
                type: string
              count:
                type: integer
            required:
              - departmentId
              - departmentName
              - count
        overdueTasks:
          type: integer
      required:
        - projectId
        - totalTasks
        - tasksByStatus
        - tasksByDepartment
        - overdueTasks

    Department:
      type: object
      properties:
