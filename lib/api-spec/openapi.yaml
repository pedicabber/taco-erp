          type: integer
        name:
          type: string
        color:
          type: ["string", "null"]
        projectId:
          type: ["integer", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - color
        - projectId
        - createdAt

    CreateDepartmentBody:
      type: object
      properties:
        name:
          type: string
        color:
          type: ["string", "null"]
        projectId:
          type: integer
      required:
        - name
        - projectId

    UpdateDepartmentBody:
      type: object
      properties:
        name:
          type: string
        color:
          type: ["string", "null"]

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [backlog, new_tasks, in_progress, in_review, blocked, complete]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        projectId:
          type: integer
        departmentId:
          type: ["integer", "null"]
        assigneeId:
          type: ["integer", "null"]
        assigneeIds:
          type: array
          items:
            type: integer
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/UserProfileMini"
        assignerId:
          type: ["integer", "null"]
        followerIds:
          type: array
          items:
            type: integer
        expectedHours:
          type: ["number", "null"]
        dueDate:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        elapsedSeconds:
          type: integer
        timerRunning:
          type: boolean
        timerStartedAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        safetyFlag:
          type: ["string", "null"]
          enum: [near_miss, incident, null]
        qualityResult:
          type: ["string", "null"]
          enum: [pass, rework, fail, null]
        deliveryStatus:
          type: ["string", "null"]
          enum: [on_time, late, null]
        costMaterialNotes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        assignee:
          $ref: "#/components/schemas/UserProfileMini"
          nullable: true
        assigner:
          $ref: "#/components/schemas/UserProfileMini"
          nullable: true
        department:
          $ref: "#/components/schemas/DepartmentMini"
          nullable: true
      required:
        - id
        - title
        - description
        - status
        - priority
        - projectId
        - departmentId
        - assigneeId
        - assigneeIds
        - assignees
        - assignerId
        - followerIds
        - expectedHours
        - dueDate
        - startDate
        - elapsedSeconds
        - timerRunning
        - timerStartedAt
        - completedAt
        - notes
        - createdAt
        - updatedAt
        - assignee
        - assigner
        - department

    UserProfileMini:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]
        departmentName:
          type: ["string", "null"]
      required:
        - id
        - name
        - avatarUrl
        - departmentName

    DepartmentMini:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: ["string", "null"]
      required:
        - id
        - name
        - color

    CreateTaskBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [backlog, new_tasks, in_progress, in_review, blocked, complete]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        projectId:
          type: integer
        departmentId:
          type: ["integer", "null"]
        assigneeId:
          type: ["integer", "null"]
        assigneeIds:
          type: array
          items:
            type: integer
        expectedHours:
          type: ["number", "null"]
        dueDate:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required:
        - title
